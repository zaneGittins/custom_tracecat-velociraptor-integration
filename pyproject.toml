[build-system]
requires = ["hatchling >= 1.13.0"]
build-backend = "hatchling.build"

[project]
name = "custom_actions"
description = "Custom velociraptor integration"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = ["pyvelociraptor==v0.1.11"]

[tool.hatch.version]
path = "custom_actions/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["custom_actions"]
include = ["/custom_actions", "/custom_actions/**/*.yml"]

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
dev = ["tracecat @ git+https://github.com/TracecatHQ/tracecat"]
